name: CI Pipeline

# Dispara a pipeline em qualquer push para qualquer branch
on: [push]

jobs:
  build-and-test:
    runs-on: ubuntu-latest  # Usa uma máquina Linux no GitHub Actions

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v3

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar Maven
        run: sudo apt-get install -y maven

      # Compila e testa o discovery-server
      - name: Build & Test - discovery-server
        run: |
          cd microsservices_esofii/discovery-server
          mvn clean install

      # Compila e testa o config-server
      - name: Build & Test - config-server
        run: |
          cd microsservices_esofii/config-server
          mvn clean install

      # Compila e testa o criar-usuarios
      - name: Build & Test - criar-usuarios
        run: |
          cd config-service/criar-usuarios
          mvn clean install

      # Compila e testa o crud-de-eventos
      - name: Build & Test - crud-de-eventos
        run: |
          cd config-service/crud-de-eventos
          mvn clean install

      # Compila e testa o notification-service
      - name: Build & Test - notification-service
        run: |
          cd config-service/notification-service
          mvn clean install

      # Login no Docker Hub (antes do build para validar credenciais)
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # Constrói todas as imagens Docker usando docker compose (v2)
      - name: Build Docker images with docker compose
        run: |
          docker compose build

      # Tag e Push das imagens para o Docker Hub
      - name: Tag and Push images to Docker Hub
        run: |
          docker tag tesk-master-discovery-server ${{ secrets.DOCKER_HUB_USERNAME }}/discovery-server:latest
          docker tag tesk-master-config-server ${{ secrets.DOCKER_HUB_USERNAME }}/config-server:latest
          docker tag tesk-master-criar-usuarios ${{ secrets.DOCKER_HUB_USERNAME }}/criar-usuarios:latest
          docker tag tesk-master-crud-de-eventos ${{ secrets.DOCKER_HUB_USERNAME }}/crud-de-eventos:latest
          docker tag tesk-master-notification-service ${{ secrets.DOCKER_HUB_USERNAME }}/notification-service:latest
          
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/discovery-server:latest
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/config-server:latest
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/criar-usuarios:latest
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/crud-de-eventos:latest
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/notification-service:latest
