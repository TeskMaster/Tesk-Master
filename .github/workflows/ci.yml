name: CI Pipeline

# Dispara a pipeline em qualquer push para qualquer branch
on: [push]

jobs:
  build-and-test:
    runs-on: ubuntu-latest  # Usa uma máquina Linux no GitHub Actions

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v3

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar Maven
        run: sudo apt-get install -y maven

      # Compila e testa o discovery-server
      - name: Build & Test - discovery-server
        run: |
          cd microsservices_esofii/discovery-server
          mvn clean install

      # Compila e testa o config-server
      - name: Build & Test - config-server
        run: |
          cd microsservices_esofii/config-server
          mvn clean install

      # Compila e testa o criar-usuarios
      - name: Build & Test - criar-usuarios
        run: |
          cd config-service/criar-usuarios
          mvn clean install

      # Compila e testa o crud-de-eventos
      - name: Build & Test - crud-de-eventos
        run: |
          cd config-service/crud-de-eventos
          mvn clean install

      # Compila e testa o notification-service
      - name: Build & Test - notification-service
        run: |
          cd config-service/notification-service
          mvn clean install

      # Constrói imagens Docker para todos os serviços
      - name: Build Docker images
        run: |
          docker build -t discovery-server ./microsservices_esofii/discovery-server
          docker build -t config-server ./microsservices_esofii/config-server
          docker build -t criar-usuarios ./config-service/criar-usuarios
          docker build -t crud-de-eventos ./config-service/crud-de-eventos
          docker build -t notification-service ./config-service/notification-service
